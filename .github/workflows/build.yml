name: build

on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/unity-desktop/ci:latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - run: meson setup build --wrap-mode=nofallback

      - run: meson compile -C build
